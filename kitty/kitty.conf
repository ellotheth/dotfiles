# ~/.config/kitty/kitty.conf

include ~/.config/kitty/current-theme.conf

background_opacity 0.9

map f11 toggle_fullscreen

# clickable links and nothing else
clear_all_mouse_actions yes
detect_urls yes
mouse_map left click grabbed,ungrabbed mouse_handle_click link

# hide the mouse pointer while i'm typing
mouse_hide_wait -3.0
# animated cursor movement hehehehe
cursor_trail 100
cursor_trail_decay 0.1 0.5
cursor_trail_start_threshold 4

# BEGIN_KITTY_FONTS
font_family      family="Ubuntu Sans Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
