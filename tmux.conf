# i'm not changing prefixes
set-option -g prefix C-a
unbind-key C-b
bind-key a send-prefix
# default `l`
bind-key C-a last-window

# notify on activity in other windows
setw -g monitor-activity on
setw -g monitor-bell on

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# move around panes like vim
bind l select-pane -R
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind L swap-pane -dt :."{right-of}"
bind H swap-pane -dt :."{left-of}"
bind J swap-pane -dt :."{down-of}"
bind K swap-pane -dt :."{up-of}"

# cycle through panes, `o` by default
# bind ^A select-pane -t :.+

set -g status-style bg=default

# quick tmux config reload
unbind R
bind R source-file ~/dotfiles/tmux.conf

set -g status-justify centre
set -g status-left ''
setw -g window-status-format '#I:#[fg=colour243,bold]#W'
setw -g window-status-current-format '#I:#[fg=yellow,bold]#[bg=colour235]#W'
